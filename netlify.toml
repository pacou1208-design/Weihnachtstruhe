[build]
  publish = "public"
  functions = "netlify/functions"

# Suchmaschinen sollen die Seite nicht finden
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# Service Worker und Startseite immer frisch laden, damit Updates ankommen
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
